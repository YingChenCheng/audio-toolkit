name: Unit Tests

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  clang-format:
    name: Code Formatting (clang-format)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run clang-format style check
        uses: pavelzw/clang-format-action@v2
        with:
          source: 'include src apps tests'
          exclude: './build'
          extensions: 'hpp,cpp,c,h'
          clangFormatVersion: 16

  static-analysis:
    name: Static Analysis (clang-tidy)
    needs: [clang-format]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Dependencies & Clang Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-tidy libasound2-dev ninja-build

      - name: Configure CMake with clang-tidy
        run: >
          cmake -B ${{github.workspace}}/build
          -DCMAKE_BUILD_TYPE=Debug
          -DENABLE_CLANG_TIDY=ON
          -DBUILD_TESTS=OFF

      - name: Run Static Analysis
        run: cmake --build ${{github.workspace}}/build

  build-and-test:
    name: ${{ matrix.os }} - ${{ matrix.build_type }}
    needs: [clang-format]
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        build_type: [Debug, Release]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install Linux Dependencies
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y libasound2-dev ninja-build

    - name: Configure CMake
      run: >
        cmake -B ${{github.workspace}}/build
        -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
        -DBUILD_TESTS=ON

    - name: Build Project
      run: cmake --build ${{github.workspace}}/build --config ${{ matrix.build_type }}

    - name: Run GoogleTest Unit Tests
      run: ctest --test-dir ${{github.workspace}}/build -C ${{ matrix.build_type }} --output-on-failure